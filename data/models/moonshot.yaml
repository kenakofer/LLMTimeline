    name: Kimi k1.5
    product_line: kimi
    open_weights: false
    epoch_id: Kimi k1.5
    events:
      - type: announced
        date: 2025-01-22
        precision: day
        confidence: confirmed
        source: https://arxiv.org/abs/2501.12599v1
      - type: available
        date: 2025-01-22
        precision: day
        confidence: estimated
        basis: >
          Epoch AI classifies access as "API access"; availability from the announcement
          date is inferred, not documented.
        source: https://arxiv.org/abs/2501.12599v1

