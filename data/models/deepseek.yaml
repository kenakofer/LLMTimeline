# DeepSeek
#
# Generated by the October 2026 backfill from Epoch AI's model database, then checked
# against first-party pages. Confidence reflects that check: `confirmed` means the date
# was found on a first-party page; `likely` means it comes from Epoch AI and was not
# found verbatim; `estimated` availability is inferred from Epoch's access classification.
# Open-weight models get no `retired` event: API shutdowns go in `notes`, because the
# weights remain available.

lab: deepseek

models:
  - id: deepseek-coder
    name: DeepSeek Coder
    family: deepseek-coder
    product_line: deepseek-coder
    params: 33B
    open_weights: true
    hf_id: deepseek-ai/deepseek-coder-33b-base
    epoch_id: DeepSeek Coder 33B
    events:
      - type: announced
        date: 2023-11-02
        precision: day
        confidence: likely
        basis: >
          Date from Epoch AI's model database; not found verbatim on the linked page.
        source: https://arxiv.org/abs/2401.14196
      - type: available
        date: 2023-11-02
        precision: day
        confidence: estimated
        basis: >
          Epoch AI classifies access as "Open weights (restricted use)"; availability
          from the announcement date is inferred, not documented.
        source: https://arxiv.org/abs/2401.14196

