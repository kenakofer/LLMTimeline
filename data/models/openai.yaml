# OpenAI
#
# Generated by the October 2026 backfill from Epoch AI's model database, then checked
# against first-party pages. Confidence reflects that check: `confirmed` means the date
# was found on a first-party page; `likely` means it comes from Epoch AI and was not
# found verbatim; `estimated` availability is inferred from Epoch's access classification.
# Open-weight models get no `retired` event: API shutdowns go in `notes`, because the
# weights remain available.

lab: openai

models:
  - id: gpt-1
    name: GPT-1
    family: gpt-1
    product_line: gpt
    params: 117M
    open_weights: true
    epoch_id: GPT-1
    events:
      - type: announced
        date: 2018-06-15
        precision: month
        confidence: likely
        basis: >
          Date from Epoch AI's model database; not found verbatim on the linked page.
          Epoch gives the first of the month, read here as month precision.
        source: https://openai.com/blog/language-unsupervised/
      - type: available
        date: 2018-06-15
        precision: month
        confidence: estimated
        basis: >
          Epoch AI classifies access as "Open weights (unrestricted)"; availability from
          the announcement date is inferred, not documented.
        source: https://openai.com/blog/language-unsupervised/

