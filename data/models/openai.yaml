# OpenAI
#
# Deprecation dates from the first-party deprecations page:
#   https://developers.openai.com/api/docs/deprecations
# That page announces a deprecation and a shutdown date together, so the
# announcement date of the deprecation notice is recorded as `deprecated` and the
# shutdown date as `retired`.
#
# Note the page moved host during 2026 (platform.openai.com -> developers.openai.com);
# scripts/check-links.mjs exists because of exactly this.

lab: openai

models:
  - id: gpt-3-5-turbo
    name: GPT-3.5 Turbo
    family: gpt-3-5
    api_name: gpt-3.5-turbo-0125
    context_window: 16000
    events:
      - type: announced
        date: 2023-11-06
        precision: day
        confidence: confirmed
        basis: >
          The 0125 snapshot is dated January 2024; the 0613 snapshot it replaced was
          deprecated on 6 November 2023, which is the first first-party date available
          for this model line.
        source: https://developers.openai.com/api/docs/deprecations
      - type: available
        date: 2024-01-25
        precision: day
        confidence: likely
        basis: >
          Snapshot name encodes the date (0125). No separate announcement post for
          this snapshot.
        source: https://developers.openai.com/api/docs/deprecations
      - type: deprecated
        date: 2026-04-22
        precision: day
        confidence: confirmed
        source: https://developers.openai.com/api/docs/deprecations
      - type: retired
        date: 2026-10-23
        precision: day
        confidence: confirmed
        source: https://developers.openai.com/api/docs/deprecations

