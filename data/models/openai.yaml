  # GPT-5.6 is the second clear instance of the limited -> general pattern that
  # motivated the events[] schema: a restricted preview to named partners, then a
  # public rollout two weeks later.
  - id: gpt-5-6-sol
    name: GPT-5.6 Sol
    family: gpt-5-6
    api_name: gpt-5.6-sol
    tags: [frontier, reasoning]
    notes: |
      Flagship of the GPT-5.6 line, released alongside Terra and Luna. Described
      by OpenAI as its best coding model, aimed at complex reasoning and agentic
      workflows.
    events:
      - type: limited
        date: 2026-06-26
        precision: day
        confidence: likely
        basis: >
          Released as a limited preview to a "small group of trusted partners",
          reported as constrained by government restrictions, ahead of the public
          rollout on 9 July 2026.
        source: https://en.wikipedia.org/wiki/GPT-5.6
