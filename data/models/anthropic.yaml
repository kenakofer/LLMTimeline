  # --------------------------------------------------------------- Mythos line
  # The hard case that motivated the events[] schema. Announced publicly but NOT
  # generally available: access was restricted to ~12 named partner organisations,
  # who had been using it for some weeks beforehand. It never reached general
  # availability under this name — it was superseded by Mythos 5.
  - id: claude-mythos-preview
    name: Claude Mythos Preview
    family: mythos
    api_name: claude-mythos-preview
    tags: [frontier, restricted, cyber]
    notes: |
      Developed for defensive cybersecurity workflows under Project Glasswing.
      Anthropic initially stated it did not plan to make Mythos Preview generally
      available, citing cyberoffense-relevant capabilities. Invitation-only, with
      no self-serve sign-up. Superseded by Claude Mythos 5 on 9 June 2026.
    events:
      - type: internal
        date: 2026-02-28
        precision: month
        confidence: estimated
        basis: >
          METR's Feb-Mar 2026 frontier risk report states that participating labs
          confirmed the models they shared represented their internal
          state-of-the-art "at some point in the mid-February to mid-March 2026
          assessment window", and names Claude Mythos Preview among the models
          assessed. Midpoint of the attested window taken. METR relies on company
          attestation, not independent verification.
        bounds: { earliest: 2026-02-15, latest: 2026-03-15 }
        source: https://metr.org/blog/2026-05-19-frontier-risk-report/
      - type: limited
        date: 2026-03-17
        precision: month
        confidence: estimated
        basis: >
          Anthropic said partner organisations had already used Mythos Preview
          "for weeks" before the broader rollout discussion. Approximately three
          weeks assumed ahead of the 7 April announcement; the source gives no
          start date, so this is a rough inference, not a reported date.
        bounds: { latest: 2026-04-07 }
        source: https://www.anthropic.com/claude/mythos
      - type: announced
        date: 2026-04-07
        precision: day
        confidence: confirmed
        basis: >
          Announced but explicitly NOT generally available. Access limited to a
          small number of named organisations including AWS, Apple, Broadcom,
          Cisco, CrowdStrike, Google, JPMorganChase, the Linux Foundation,
          Microsoft, NVIDIA and Palo Alto Networks.
        source: https://www.anthropic.com/claude/mythos
      - type: deprecated
        date: 2026-06-09
        precision: day
        confidence: confirmed
        basis: >
          Deprecated on the release of Claude Mythos 5, which joined the same
          invitation-only Project Glasswing programme.
        source: https://platform.claude.com/docs/en/docs/about-claude/model-deprecations

