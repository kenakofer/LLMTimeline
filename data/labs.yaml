# Lab registry. `order` controls row grouping top-to-bottom in the chart.
# `color` is a token resolved by the renderer's palette, not a literal hex value —
# keeping hues out of the data files means the palette can be retuned for
# light/dark mode without touching the dataset.

labs:
  - id: openai
    name: OpenAI
    color: lab-1
    order: 1
    country: US
    homepage: https://openai.com

